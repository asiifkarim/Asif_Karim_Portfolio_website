name: Backend CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt
    
    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Check code formatting with black
      run: |
        pip install black
        black --check backend/ || echo "Code formatting check completed"
    
    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics || echo "Linting completed"
    
    - name: Run tests (if available)
      run: |
        cd backend
        # Add your test command here
        # pytest tests/ || echo "No tests found"
        echo "Tests would run here"
    
    - name: Check security with bandit
      run: |
        pip install bandit
        bandit -r backend/ -ll || echo "Security check completed"

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        cd backend
        docker build -t portfolio-backend:latest .
    
    - name: Test Docker image
      run: |
        docker run -d -p 8000:8000 \
          -e SECRET_KEY=test-secret-key \
          -e GITHUB_USERNAME=asiifkarim \
          --name test-backend \
          portfolio-backend:latest
        sleep 10
        curl -f http://localhost:8000/health || exit 1
        docker stop test-backend
        docker rm test-backend

  deploy-notification:
    name: Deployment Ready
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Deployment notification
      run: |
        echo "✅ Backend is ready for deployment!"
        echo "🚀 Deploy to Railway: https://railway.app"
        echo "🚀 Deploy to Render: https://render.com"
