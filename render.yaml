services:
  # Backend Service
  - type: web
    name: portfolio-backend
    env: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GITHUB_USERNAME
        sync: false
    autoDeploy: true

  # Static Site (Frontend) - Optional if using Vercel
  - type: web
    name: portfolio-frontend
    env: static
    region: oregon
    plan: free
    branch: main
    rootDir: frontend/src
    buildCommand: echo "No build needed for static site"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    autoDeploy: true
