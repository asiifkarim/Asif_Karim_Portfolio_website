<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Portfolio CMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .admin-container {
            display: flex;
            min-height: 100vh;
            background: var(--background-secondary);
        }
        
        .admin-sidebar {
            width: 250px;
            background: var(--background-primary);
            border-right: 1px solid var(--border-color);
            padding: var(--spacing-xl);
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }
        
        .admin-header {
            padding: var(--spacing-md);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: var(--spacing-xl);
        }
        
        .admin-header h2 {
            color: var(--primary-color);
            margin-bottom: var(--spacing-xs);
        }
        
        .admin-nav {
            list-style: none;
        }
        
        .admin-nav li {
            margin-bottom: var(--spacing-xs);
        }
        
        .admin-nav a {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-md);
            color: var(--text-primary);
            border-radius: var(--radius-md);
            transition: all var(--transition-fast);
        }
        
        .admin-nav a:hover,
        .admin-nav a.active {
            background: var(--background-secondary);
            color: var(--secondary-color);
        }
        
        .admin-content {
            flex: 1;
            margin-left: 250px;
            padding: var(--spacing-xl);
        }
        
        .admin-section {
            display: none;
            background: var(--background-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
        }
        
        .admin-section.active {
            display: block;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-xl);
            padding-bottom: var(--spacing-md);
            border-bottom: 1px solid var(--border-color);
        }
        
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: var(--spacing-lg);
        }
        
        .admin-table th,
        .admin-table td {
            padding: var(--spacing-md);
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        
        .admin-table th {
            background: var(--background-secondary);
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .admin-table img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: var(--radius-sm);
        }
        
        .action-buttons {
            display: flex;
            gap: var(--spacing-sm);
        }
        
        .btn-sm {
            padding: var(--spacing-xs) var(--spacing-md);
            font-size: var(--font-size-sm);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: var(--background-primary);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-md);
            padding: var(--spacing-xl);
            text-align: center;
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        
        .upload-area:hover {
            border-color: var(--secondary-color);
            background: var(--background-secondary);
        }
        
        .upload-area.dragover {
            border-color: var(--secondary-color);
            background: var(--background-secondary);
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-sidebar">
            <div class="admin-header">
                <h2><i class="fas fa-tachometer-alt"></i> Admin Panel</h2>
                <p style="font-size: var(--font-size-sm); color: var(--text-secondary);">Content Management</p>
            </div>
            
            <ul class="admin-nav">
                <li><a href="#" class="nav-link active" data-section="images"><i class="fas fa-images"></i> Images</a></li>
                <li><a href="#" class="nav-link" data-section="projects"><i class="fas fa-folder"></i> Projects</a></li>
                <li><a href="#" class="nav-link" data-section="blogs"><i class="fas fa-blog"></i> Blogs</a></li>
                <li><a href="#" class="nav-link" data-section="services"><i class="fas fa-cogs"></i> Services</a></li>
                <li><a href="/" target="_blank"><i class="fas fa-home"></i> View Site</a></li>
                <li><a href="#" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </div>
        
        <div class="admin-content">
            <!-- Images Section -->
            <div id="images-section" class="admin-section active">
                <div class="section-header">
                    <h3><i class="fas fa-images"></i> Image Management</h3>
                    <button class="btn btn-primary" onclick="showUploadModal()">
                        <i class="fas fa-upload"></i> Upload Image
                    </button>
                </div>
                
                <div id="images-list">
                    <p>Loading images...</p>
                </div>
            </div>
            
            <!-- Projects Section -->
            <div id="projects-section" class="admin-section">
                <div class="section-header">
                    <h3><i class="fas fa-folder"></i> Project Management</h3>
                    <button class="btn btn-primary" onclick="showProjectModal()">
                        <i class="fas fa-plus"></i> Add Project
                    </button>
                </div>
                
                <div id="projects-list">
                    <p>Loading projects...</p>
                </div>
            </div>
            
            <!-- Blogs Section -->
            <div id="blogs-section" class="admin-section">
                <div class="section-header">
                    <h3><i class="fas fa-blog"></i> Blog Management</h3>
                    <button class="btn btn-primary" onclick="showBlogModal()">
                        <i class="fas fa-plus"></i> Add Blog
                    </button>
                </div>
                
                <div id="blogs-list">
                    <p>Loading blogs...</p>
                </div>
            </div>
            
            <!-- Services Section -->
            <div id="services-section" class="admin-section">
                <div class="section-header">
                    <h3><i class="fas fa-cogs"></i> Service Management</h3>
                    <button class="btn btn-primary" onclick="showServiceModal()">
                        <i class="fas fa-plus"></i> Add Service
                    </button>
                </div>
                
                <div id="services-list">
                    <p>Loading services...</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Upload Image Modal -->
    <div id="upload-modal" class="modal">
        <div class="modal-content">
            <h3>Upload Image</h3>
            <form id="upload-form">
                <div class="form-group">
                    <label>Image File</label>
                    <div class="upload-area" id="upload-area">
                        <i class="fas fa-cloud-upload-alt" style="font-size: 3rem; color: var(--text-secondary); margin-bottom: var(--spacing-md);"></i>
                        <p>Click or drag image here</p>
                        <input type="file" id="image-file" accept="image/*" style="display: none;">
                    </div>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="image-category" class="form-control">
                        <option value="profile">Profile</option>
                        <option value="project">Project</option>
                        <option value="blog">Blog</option>
                        <option value="general">General</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Alt Text</label>
                    <input type="text" id="image-alt" class="form-control">
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="is-profile"> Set as Profile Image
                    </label>
                </div>
                <div class="action-buttons">
                    <button type="submit" class="btn btn-primary">Upload</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal('upload-modal')">Cancel</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="/static/js/admin.js"></script>
</body>
</html>
